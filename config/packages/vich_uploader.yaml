vich_uploader:
    db_driver: orm

    mappings:
#        TODO : delete oh_*
        uploads:
            uri_prefix: /uploads
            upload_destination: '%kernel.project_dir%/public/uploads'
            namer: Vich\UploaderBundle\Naming\Base64Namer
        enshrouded_item_icon:
            uri_prefix: '%uploads.enshrouded_item_icon_dir%'
            upload_destination: '%kernel.project_dir%/public%uploads.enshrouded_item_icon_dir%'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
        enshrouded_npc_icon:
            uri_prefix: '%uploads.enshrouded_npc_icon_dir%'
            upload_destination: '%kernel.project_dir%/public%uploads.enshrouded_npc_icon_dir%'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
        vestigia_item:
            uri_prefix: '%uploads.vestigia_item_dir%'
            upload_destination: '%kernel.project_dir%/public%uploads.vestigia_item_dir%'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
